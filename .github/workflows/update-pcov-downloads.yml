name: Update PCOV downloads badge

on:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-pcov-downloads.yml
      - scripts/update-pcov-downloads.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Calculate combined lifetime Packagist downloads
        run: python3 scripts/update-pcov-downloads.py
      - name: Commit updated badge
        run: |
          if git diff --quiet -- profile/pcov-downloads.json; then
            echo "Download count unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/pcov-downloads.json
          git commit -m "Update combined PCOV downloads badge [skip ci]"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              echo "::error::Could not rebase the badge update onto main."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Push failed; retrying after refreshing main (attempt $attempt/5)."
              sleep "$((attempt * 2))"
            fi
          done
          echo "::error::Failed to publish the badge after 5 attempts."
          exit 1
