name: Update GitHub stats cards

# Manual refresh requested: 2026-10-22T10:38:01Z
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-github-stats.yml
      - scripts/update_github_stats.py

permissions:
  contents: write

env:
  STATS_CARD_PATH: profile/stats-${{ github.run_id }}.svg

jobs:
  update-cards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create profile asset directory
        run: mkdir -p profile

      - name: Generate stats card
        id: stats
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_title=true&count_private=true"
          path: .stats-card.svg
          token: ${{ secrets.STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate public stats when the personal token is unavailable
        if: steps.stats.outcome == 'failure'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_title=true&count_private=false"
          path: .stats-card.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Validate and install stats card
        run: python3 scripts/update_github_stats.py .stats-card.svg "$STATS_CARD_PATH"

      - name: Commit cards
        run: |
          git add README.md profile
          if git diff --cached --quiet -- README.md profile; then
            echo "No stats card changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub stats cards"
          git push
