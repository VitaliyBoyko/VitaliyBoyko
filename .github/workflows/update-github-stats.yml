name: Update GitHub stats cards

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-github-stats.yml

permissions:
  contents: write

env:
  STATS_CARD_PATH: profile/stats-${{ github.run_id }}.svg

jobs:
  update-cards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create profile asset directory
        run: mkdir -p profile

      - name: Remove old stats cards
        run: rm -f profile/stats.svg profile/stats-*.svg profile/top-langs.svg

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_title=true&count_private=true"
          path: ${{ env.STATS_CARD_PATH }}
          token: ${{ secrets.STATS_TOKEN }}

      - name: Update README stats card path
        run: |
          perl -0pi -e "s#!\\[GitHub Stats\\]\\(\\./profile/stats(?:-[0-9]+)?\\.svg\\)#![GitHub Stats](./${STATS_CARD_PATH})#" README.md

      - name: Commit cards
        run: |
          git add README.md profile
          if git diff --cached --quiet -- README.md profile; then
            echo "No stats card changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub stats cards"
          git push
