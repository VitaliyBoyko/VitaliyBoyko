name: Update GitHub stats cards

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-github-stats.yml

permissions:
  contents: write

jobs:
  update-cards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create profile asset directory
        run: mkdir -p profile

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_title=true&count_private=true"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git add profile/*.svg
          if git diff --cached --quiet -- profile; then
            echo "No stats card changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub stats cards"
          git push
