name: Update template coverage downloads badge

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
  push:
    paths:
      - .github/workflows/update-template-coverage-downloads.yml
      - scripts/update-template-coverage-downloads.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate combined lifetime npm downloads
        run: python3 scripts/update-template-coverage-downloads.py
      - name: Commit updated badge
        run: |
          if git diff --quiet -- profile/template-coverage-downloads.json; then
            echo "Download count unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/template-coverage-downloads.json
          git commit -m "Update combined npm downloads badge [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
